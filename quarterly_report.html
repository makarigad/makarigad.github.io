<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1"/>
    <title>30-Page Enterprise Board Report — Makari Gad HEP</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root { --navy:#0f172a; --blue:#1e40af; --teal:#0d9488; --green:#059669; --red:#dc2626; --slate:#64748b; --border:#e2e8f0; --bg:#f1f5f9; }
        body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--navy); margin: 0; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important;}
        
        .control-bar { background: var(--navy); padding: 1rem 2rem; position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 20px rgba(15,23,42,0.4); display:flex; justify-content:space-between; align-items:center;}
        .form-control { padding: 0.4rem 0.75rem; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 6px; font-size: 0.85rem; font-weight: 600; outline: none; color: white; }
        .form-control option { color: var(--navy); background: white; }
        .btn { display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.5rem 1rem; border-radius: 6px; font-size: 0.85rem; font-weight: 700; cursor: pointer; color: white; border:none; transition: 0.2s; }
        .btn-primary { background: #3b82f6; } .btn-success { background: #10b981; }
        .btn-outline { background: transparent; border: 1.5px solid rgba(255,255,255,0.3); color: white; text-decoration: none; }
        .btn-outline:hover { background: rgba(255,255,255,0.1); }
        
        .deck { display: flex; flex-direction: column; gap: 2rem; align-items: center; padding: 2rem 0; }
        .slide { 
            background: white; width: 297mm; height: 210mm; 
            box-shadow: 0 16px 40px rgba(0,0,0,0.12); position: relative; 
            padding: 12mm 15mm; display: flex; flex-direction: column; overflow: hidden;
            page-break-after: always; break-after: page;
        }
        
        .s-title { font-family: 'Playfair Display', serif; font-size: 24pt; font-weight: 900; color: var(--navy); margin-bottom: 0.15rem; text-transform: uppercase; }
        .s-sub { font-size: 10pt; color: var(--blue); font-weight: 700; margin-bottom: 0.75rem; border-bottom: 2px solid var(--teal); padding-bottom: 0.25rem; display: flex; justify-content: space-between; }
        
        .kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; margin-bottom: 1rem; }
        .kpi-card { padding: 0.75rem 1rem; border-radius: 8px; border: 1px solid var(--border); border-left: 4px solid var(--blue); background: #f8fafc; }
        .kpi-val { font-family: 'Playfair Display', serif; font-size: 20pt; font-weight: 900; color: var(--navy); }
        .kpi-lbl { font-size: 7.5pt; font-weight: 800; color: var(--slate); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 2px;}
        
        .q-table { width: 100%; border-collapse: collapse; font-size: 8.5pt; margin-bottom: 0.5rem;}
        .q-table th { background: var(--navy); color: white; padding: 6px 8px; text-align: center; font-weight: 700; border: 1px solid var(--border); }
        .q-table th:first-child, .q-table td:first-child { text-align: left; background: #f8fafc; font-weight: 700; }
        .q-table td { border: 1px solid var(--border); padding: 6px 8px; text-align: center; font-weight: 600; color: #1e293b;}
        
        .edit-box { flex: 1; padding: 10px; border: 1.5px dashed #cbd5e1; border-radius: 6px; background: #f8fafc; font-size: 9.5pt; line-height: 1.6; outline: none; transition: 0.2s; color: #334155;}
        .edit-box:focus, tbody[contenteditable="true"]:focus { background: white; border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.1); outline:none;}
        .narrative-title { font-size: 10pt; font-weight: 800; color: var(--blue); text-transform: uppercase; margin-bottom: 6px; letter-spacing: 0.02em; }

        .slide-footer { position: absolute; bottom: 5mm; left: 15mm; right: 15mm; display: flex; justify-content: space-between; font-size: 7.5pt; color: #94a3b8; font-weight: 600; border-top: 1px solid #e2e8f0; padding-top: 4px;}

        @media print {
            @page { size: A4 landscape; margin: 0; }
            body { background: white !important; }
            .control-bar, .no-print { display: none !important; }
            .deck { padding: 0; gap: 0; }
            .slide { box-shadow: none; margin: 0; border: none; }
            .edit-box { border: none !important; background: transparent !important; padding: 0 !important; }
        }
    </style>
</head>
<body>

<div class="control-bar no-print">
    <div class="flex items-center gap-4">
        <h1 class="text-white font-bold text-sm uppercase tracking-wider">30-Slide Board Report Generator</h1>
        <div class="flex items-center gap-2">
            <span class="text-xs font-bold text-slate-400">SELECT YEAR (BS):</span>
            <select id="sel-year" class="form-control"></select>
            <button id="btn-generate" class="btn btn-primary ml-2">Generate Full Deck</button>
            <a href="energy-summary.html" class="btn btn-outline">Back to Reports</a>
            <a href="index.html" class="btn btn-outline" style="background: rgba(255,255,255,0.05);">Hub</a>
        </div>
    </div>
    <button id="btn-print" class="btn btn-success hidden">Export to PDF</button>
</div>

<div id="loading" class="hidden text-center py-20 no-print">
    <div class="w-12 h-12 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
    <p class="text-lg font-bold text-slate-700" id="loading-txt">Querying Database...</p>
</div>

<div id="deck" class="deck hidden"></div>

<script type="module">
import { supabase, initializeApplication } from '/assets/js/core-app.js';

const CAL = ["Baisakh", "Jestha", "Ashar", "Shrawan", "Bhadra", "Ashoj", "Kartik", "Mangshir", "Poush", "Magh", "Falgun", "Chaitra"];
const PPA_DAYS = [31, 31, 32, 31, 31, 31, 30, 29, 30, 29, 30, 30]; 
const PPA_CONTRACT = [5454.57, 7070.98, 7299.07, 7070.98, 7070.98, 7070.98, 6697.70, 5450.85, 4560.67, 3850.34, 4005.75, 4153.57];
const PPA_RATE_DRY = 8.40; const PPA_RATE_WET = 4.80; const WET_MONTHS = [0, 1, 2, 3, 4, 5]; 

let charts = [];
window.currentReportId = null; 
const fmt = (v, d=2) => parseFloat(v||0).toLocaleString('en-US', { minimumFractionDigits:d, maximumFractionDigits:d });
const pN = (v) => { const n = parseFloat(String(v).replace(/,/g,'')); return isNaN(n) ? 0 : n; };

(async () => {
    try { await initializeApplication(true); } catch(e) {}
    let opts = ''; for(let y = 2079; y<=2085; y++) opts += `<option value="${y}" ${y===2082?'selected':''}>${y}</option>`;
    document.getElementById('sel-year').innerHTML = opts;
    document.getElementById('btn-generate').addEventListener('click', generateReport);
})();

async function fetchYearData(year) {
    let t = { contract:0, ad:0, gen:0, expPH:0, balanch:0, imp:0, losses: { grid:0, line132:0, line33:0, penstock:0, equip:0, dispatch:0, station:0, transformer:0, transmLoss:0, lowDischarge:0 }, trips: { internal: 0, external: 0, dispatch: 0, total: 0 }, fin: { revBase:0, revExcess:0, penalty:0, royalty:0, netRecv:0 }, hourlyData: [], outagesData: [], historicalData: [], weatherData: [], rainfallData: [] };
    
    // Quarters Structure
    let q = [ 
        JSON.parse(JSON.stringify(t)), // Q1 (Baisakh, Jestha, Ashar)
        JSON.parse(JSON.stringify(t)), // Q2 (Shrawan, Bhadra, Ashoj)
        JSON.parse(JSON.stringify(t)), // Q3 (Kartik, Mangshir, Poush)
        JSON.parse(JSON.stringify(t))  // Q4 (Magh, Falgun, Chaitra)
    ];
    let mData = Array(12).fill(null).map(() => JSON.parse(JSON.stringify(t)));
    let allPlantData = [];
    let allEngDates = [];

    for(let mIdx=0; mIdx<12; mIdx++) {
        let d = mData[mIdx];
        d.name = CAL[mIdx]; d.contract = PPA_CONTRACT[mIdx];
        const qVal = `${year}.${String(mIdx+1).padStart(2,'0')}.%`;
        
        const { data: cData } = await supabase.from('contract_energy').select('*').eq('year', year).eq('month', CAL[mIdx]).maybeSingle();
        if(cData) {
            d.ad = pN(cData.total_ad) || PPA_CONTRACT[mIdx];
            d.losses.grid = pN(cData.grid_fault_mwh); d.losses.line132 = pN(cData.line_132kv_mwh); d.losses.line33 = pN(cData.fm_33kv_mwh); 
            d.losses.penstock = pN(cData.fm_penstock_mwh); d.losses.equip = pN(cData.fm_equipment_mwh); d.losses.dispatch = pN(cData.dispatch_mwh);
        } else { d.ad = PPA_CONTRACT[mIdx]; }

        const { data: pData } = await supabase.from('plant_data').select('*').like('nepali_date', qVal).order('id');
        if (pData && pData.length > 0) {
            allPlantData = allPlantData.concat(pData);
            if (pData.length > 1) {
                const f = pData[0], l = pData[pData.length - 1];
                d.gen = Math.max(0, pN(l.unit1_gen)-pN(f.unit1_gen)) + Math.max(0, pN(l.unit2_gen)-pN(f.unit2_gen));
                d.expPH = Math.max(0, pN(l.export_plant)-pN(f.export_plant));
                d.losses.station = Math.max(0, pN(l.station_trans)-pN(f.station_trans)) / 1000;
                
                const engDates = pData.map(p=>p.id).filter(Boolean);
                allEngDates = allEngDates.concat(engDates);
                
                const { data: oData } = await supabase.from('outages').select('*').in('id', engDates);
                if(oData) {
                    d.trips.internal = oData.filter(o => pN(o.energy_loss_other) > 0).reduce((s,o)=>s+pN(o.no_of_trippings),0);
                    d.trips.external = oData.filter(o => pN(o.energy_loss_line_trip) > 0).reduce((s,o)=>s+pN(o.no_of_trippings),0);
                    d.trips.dispatch = oData.filter(o => pN(o.nea_curtailed_energy) > 0).reduce((s,o)=>s+pN(o.no_of_trippings),0);
                    d.trips.total = d.trips.internal + d.trips.external + d.trips.dispatch;
                    t.outagesData = t.outagesData.concat(oData);
                }
            }
        }

        const { data: bData } = await supabase.from('balanch_readings').select('*').like('nep_date', qVal).order('eng_date');
        if (bData && bData.length > 1) {
            const f = bData[0], l = bData[bData.length - 1];
            d.balanch = Math.max(0, pN(l.main_export??l.check_export)-pN(f.main_export??f.check_export));
        }

        d.losses.transmLoss = Math.max(0, d.expPH - d.balanch);
        d.losses.transformer = Math.max(0, d.gen - d.expPH - d.losses.station);
        const combinedFaults = d.losses.grid + d.losses.line132 + d.losses.line33 + d.losses.penstock + d.losses.equip + d.losses.dispatch;
        d.losses.lowDischarge = Math.max(0, d.contract - (d.gen > 0 ? d.gen : d.balanch) - combinedFaults);
        
        // Fin Calc
        const escWet = Math.max(0, year - 2080); const escDry = Math.max(0, mIdx === 11 ? year - 2079 : year - 2080);
        const rate = WET_MONTHS.includes(mIdx) ? [4.8, 4.94, 5.09, 5.24, 5.39, 5.55][Math.min(escWet, 5)] : [8.4, 8.65, 8.9, 9.16, 9.43, 9.71][Math.min(escDry, 5)];
        const normalMwh = Math.min(d.balanch, d.ad, d.contract);
        d.fin.revBase = normalMwh * rate * 1000;
        d.fin.revExcess = Math.max(0, Math.min(d.balanch, d.contract) - normalMwh) * (rate / 2) * 1000;
        d.fin.penalty = Math.max(0, (0.9 * d.ad) - d.balanch) * 0.10 * rate * 1000;
        d.fin.royalty = (d.fin.revBase + d.fin.revExcess) * 0.02;
        d.fin.netRecv = (d.fin.revBase + d.fin.revExcess) - d.fin.penalty - d.fin.royalty;

        // Add to Total
        Object.keys(t).forEach(k => { 
            if (typeof t[k] === 'number') t[k] += d[k]; 
            else if (Array.isArray(t[k])) { /* skip arrays */ } 
            else Object.keys(t[k]).forEach(sub => t[k][sub] += d[k][sub]); 
        });
        
        // Add to Quarter
        let qIdx = Math.floor(mIdx / 3);
        Object.keys(q[qIdx]).forEach(k => { 
            if (typeof q[qIdx][k] === 'number') q[qIdx][k] += d[k]; 
            else if (Array.isArray(q[qIdx][k])) { /* skip arrays */ } 
            else Object.keys(q[qIdx][k]).forEach(sub => q[qIdx][k][sub] += d[k][sub]); 
        });
    }
    
    // Fetch hourly logs, historical data, and weather data for the year
    if (allEngDates.length > 0) {
        const { data: hData } = await supabase.from('hourly_logs').select('log_date,log_time,e_out_mw,e_out_cos,t_temp_out,t_temp_in,t_temp_intake').in('log_date', allEngDates);
        t.hourlyData = hData || [];
        
        // Fetch historical data
        const minDate = allEngDates[0];
        const maxDate = allEngDates[allEngDates.length - 1];
        const endObj = new Date(maxDate); endObj.setHours(23, 59, 59, 999);
        const startIso = new Date(minDate).toISOString();
        const endIso = endObj.toISOString();
        let histData = [];
        let page = 0, more = true;
        const MAX_PAGES = 50;
        while(more && page < MAX_PAGES) {
            const { data, error } = await supabase.from('historical_data')
                .select('timestamp, active_power_kw')
                .gte('timestamp', startIso).lte('timestamp', endIso)
                .order('timestamp').range(page*1000, (page+1)*1000 - 1);
            if (error) break;
            if (data && data.length > 0) histData = histData.concat(data);
            more = (data && data.length === 1000);
            page++;
        }
        t.historicalData = histData;
        
        // Weather data from Open-Meteo
        try {
            const res = await fetch(`https://archive-api.open-meteo.com/v1/archive?latitude=29.744&longitude=80.964&elevation=4200&start_date=${minDate}&end_date=${maxDate}&daily=temperature_2m_mean,precipitation_sum&timezone=Asia%2FKathmandu`);
            const wData = await res.json();
            t.weatherData = wData.daily || null;
        } catch(e) { console.warn("Weather fetch failed", e); }
    }
    
    // Fetch rainfall data
    try {
        const { data: rData } = await supabase.from('rainfall_data').select('*');
        t.rainfallData = rData || [];
    } catch(e) { console.warn("Rainfall data fetch failed", e); }
    
    t.plantFactor = (t.gen / (10 * 24 * 365)) * 100;
    q.forEach((qr, i) => { qr.plantFactor = (qr.gen / (10 * 24 * (PPA_DAYS[i*3]+PPA_DAYS[i*3+1]+PPA_DAYS[i*3+2]))) * 100; });

    return { t, q, mData };
}

async function generateReport() {
    const year = parseInt(document.getElementById('sel-year').value);
    document.getElementById('loading').classList.remove('hidden'); document.getElementById('deck').classList.add('hidden');
    charts.forEach(c => c.destroy()); charts = [];
    window.currentReportId = `board_deck_${year}`;

    try {
        const { data: nar } = await supabase.from('board_report_executive').select('*').eq('report_id', window.currentReportId).maybeSingle();
        document.getElementById('loading-txt').innerText = `Extracting DB for FY ${year}...`;
        const { t, q, mData } = await fetchYearData(year);
        
        document.getElementById('loading-txt').innerText = `Extracting Previous Year ${year-1}...`;
        const { t: pt } = await fetchYearData(year-1);

        renderDeck(t, q, mData, pt, year, nar || {});
        
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('deck').classList.remove('hidden'); document.getElementById('btn-print').classList.remove('hidden'); attachAutoSave();
    } catch(err) { alert("Error: " + err.message); document.getElementById('loading').classList.add('hidden'); }
}

const getToday = () => new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
const footer = (slideNum) => `<div class="slide-footer"><span>Makari Gad Hydroelectric Project (10 MW)</span><span>Page ${slideNum} of 32</span><span>Report Generated: ${getToday()}</span></div>`;
const getTds = (d, keys) => d.map(m => `<td>${fmt(keys.reduce((obj, k) => obj[k], m))}</td>`).join('');

function renderDeck(t, q, m, pt, year, nar) {
    const deck = document.getElementById('deck');
    let html = '';
    let slideIdx = 1;

    // SECTION 1: EXEC (Slides 1-5)
    // 1. Cover
    html += `
        <div class="slide" style="padding:0; background-color:#0f172a;">
            <div class="relative w-full h-full flex flex-col justify-center items-center text-center p-12 overflow-hidden">
                <div class="absolute inset-0 bg-gradient-to-br from-navy to-blue-900 z-10 opacity-90 pointer-events-none"></div>
                <div class="z-20 flex flex-col items-center border border-white/10 p-16 rounded-3xl bg-white/5 backdrop-blur-md shadow-2xl w-3/4">
                    <h3 class="text-teal-400 font-bold tracking-widest uppercase text-2xl mb-4">Board of Directors Review</h3>
                    <h1 class="text-white font-black text-[50pt] leading-tight mb-4 font-serif drop-shadow-lg">Makari Gad (10 MW)</h1>
                    <h2 class="text-blue-200 font-bold text-[22pt] mb-12 drop-shadow-md">Enterprise Performance, Financial & Operational Report</h2>
                    <div class="bg-white text-navy px-10 py-3 rounded-full font-black text-2xl shadow-xl">FISCAL YEAR: ${year} BS</div>
                </div>
            </div>
        </div>`; slideIdx++;

    // 2. Agenda
    html += `<div class="slide"><div class="s-title">Board Meeting Agenda</div><div class="s-sub"><span>FY ${year} Review</span></div>
        <div class="flex flex-col justify-center items-center h-full">
            <div class="text-2xl font-bold leading-loose text-slate-700 space-y-6">
                <p>1. Executive Summary & Key Decisions Required</p>
                <p>2. Energy Generation & Plant Performance</p>
                <p>3. Financial Realization & Penalties</p>
                <p>4. Loss Analysis & Forced Outages (RCA)</p>
                <p>5. Multi-Year Historical Comparisons</p>
                <p>6. ESG (Safety, Environment) & Asset Integrity</p>
                <p>7. Risk Register & Strategic Outlook</p>
            </div>
        </div>${footer(slideIdx++)}</div>`;

    // 3. Decisions
    html += `<div class="slide"><div class="s-title">Key Decisions & Approvals Required</div><div class="s-sub"><span>Action Items for the Board</span></div>
        <div class="flex flex-col h-full"><div id="slide_decisions" contenteditable="true" class="edit-box text-xl leading-relaxed p-10" data-col="slide_decisions">${nar.slide_decisions||`<ul class="list-disc pl-10 space-y-6"><li><strong>Decision 1:</strong> Approval of NPR [Amount] for landslide protection gabion walls near AB14-AB18.</li><li><strong>Decision 2:</strong> Approval for penstock pipe realignment works prior to peak monsoon.</li><li><strong>Decision 3:</strong> Approval of the revised O&M Budget for emergency spare procurement (AVR and Governor Oil).</li></ul>`}</div></div>${footer(slideIdx++)}</div>`;

    // 4. Exec Summary 5 Qs
    html += `<div class="slide"><div class="s-title">Executive Summary</div><div class="s-sub"><span>The 5 Management Questions</span></div>
        <div class="flex flex-col h-full"><div id="slide_exec5" contenteditable="true" class="edit-box text-lg leading-relaxed p-10 space-y-6" data-col="slide_exec5">${nar.slide_exec5||`<p><strong>1. What went well?</strong> Strong monsoon generation; zero penalties in Q2 and Q4; zero Lost Time Injuries.</p><p><strong>2. What went wrong?</strong> Severe low river discharge during winter; 33kV line relocation issues caused unexpected downtime.</p><p><strong>3. What is management doing?</strong> Rerouted transmission lines at Nalabagad; initiated aggressive pre-monsoon maintenance.</p><p><strong>4. Financial Impact?</strong> Net receivable estimated at NPR ${fmt(t.fin.netRecv/1000000)} Million. Protected by PPA escalation.</p><p><strong>5. Major Risk?</strong> Flooding at the desilting basin and landslides near the powerhouse.</p>`}</div></div>${footer(slideIdx++)}</div>`;

    // 5. KPI Dash
    html += `<div class="slide"><div class="s-title">Key Performance Indicators</div><div class="s-sub"><span>FY ${year} Dashboard</span></div>
        <div class="grid grid-cols-2 gap-10 h-full p-10">
            <div class="kpi-card text-center border-l-8 border-l-emerald-500 py-10"><div class="kpi-lbl text-xl">Total Metered Energy</div><div class="kpi-val text-emerald-600 text-6xl mt-4">${fmt(t.balanch)} <span class="text-2xl">MWh</span></div></div>
            <div class="kpi-card text-center border-l-8 border-l-blue-500 py-10"><div class="kpi-lbl text-xl">Avg. Plant Factor</div><div class="kpi-val text-blue-600 text-6xl mt-4">${fmt(t.plantFactor)} <span class="text-2xl">%</span></div></div>
            <div class="kpi-card text-center border-l-8 border-l-indigo-500 py-10"><div class="kpi-lbl text-xl">Net Receivable</div><div class="kpi-val text-indigo-700 text-6xl mt-4">${fmt(t.fin.netRecv/1000000)} <span class="text-2xl">M NPR</span></div></div>
            <div class="kpi-card text-center border-l-8 border-l-red-500 py-10"><div class="kpi-lbl text-xl">Total Energy Loss</div><div class="kpi-val text-red-600 text-6xl mt-4">${fmt(t.losses.lowDischarge+t.losses.totalExt)} <span class="text-2xl">MWh</span></div></div>
        </div>${footer(slideIdx++)}</div>`;


    // SECTION 2: ENERGY ANALYTICS (Slides 6-12)
    // 6. Overall Energy
    html += `<div class="slide"><div class="s-title">Total Period Energy Performance</div><div class="s-sub"><span>FY ${year} Totals</span></div>
        <div class="flex flex-col h-full text-2xl space-y-8 p-10">
            <div class="flex justify-between border-b pb-4"><strong>Contract Target:</strong> <span>${fmt(t.contract)} MWh</span></div>
            <div class="flex justify-between border-b pb-4"><strong>Declared AD:</strong> <span>${fmt(t.ad)} MWh</span></div>
            <div class="flex justify-between border-b pb-4 text-blue-800"><strong>Powerhouse Generation:</strong> <span>${fmt(t.gen)} MWh</span></div>
            <div class="flex justify-between border-b pb-4 text-emerald-700 font-bold"><strong>Balanch Metered (Export):</strong> <span>${fmt(t.balanch)} MWh</span></div>
            <div id="slide_en_insight" contenteditable="true" class="edit-box text-xl p-6 bg-blue-50" data-col="slide_en_insight">${nar.slide_en_insight||`<strong>Key Insight:</strong> Generation closely tracked the Availability Declaration (AD), proving our forecasting models are highly accurate despite variations against the contract target.`}</div>
        </div>${footer(slideIdx++)}</div>`;

    // 7, 8, 9, 10. Q1-Q4 Breakdowns
    const qNames = ['Q1 (Baisakh–Ashar)', 'Q2 (Shrawan–Ashoj)', 'Q3 (Kartik–Poush)', 'Q4 (Magh–Chaitra)'];
    q.forEach((qr, i) => {

function attachAutoSave() {
    let timeout;
    document.querySelectorAll('.edit-box, tbody[contenteditable="true"]').forEach(el => {
        el.addEventListener('input', (e) => {
            clearTimeout(timeout);
            timeout = setTimeout(async () => {
                const val = e.target.innerHTML; const col = e.target.dataset.col;
                const { error } = await supabase.from('board_report_executive').upsert({ report_id: window.currentReportId, [col]: val, updated_at: new Date().toISOString() }, { onConflict: 'report_id' });
                if(!error) { const orig = el.style.backgroundColor; el.style.backgroundColor = '#dcfce7'; setTimeout(() => el.style.backgroundColor = orig, 500); }
            }, 1200);
        });
    });
}

document.getElementById('btn-print').onclick = async () => {
    const btn = document.getElementById('btn-print'); btn.disabled = true; btn.textContent = 'Preparing PDF...';
    const replacements = [];
    document.querySelectorAll('#deck canvas').forEach(canvas => {
        const img = document.createElement('img'); img.src = canvas.toDataURL('image/png', 1.0); img.style.cssText = `width:100%;height:${canvas.offsetHeight}px;object-fit:contain;`;
        canvas.parentNode.insertBefore(img, canvas); canvas.style.display = 'none'; replacements.push({ canvas, img });
    });
    await new Promise(r => setTimeout(r, 400)); window.print();
    setTimeout(() => { replacements.forEach(({ canvas, img }) => { canvas.style.display = ''; img.remove(); }); btn.disabled = false; btn.textContent = 'Export to PDF'; }, 1500);
};
